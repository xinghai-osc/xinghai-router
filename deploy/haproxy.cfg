global
    log stdout format raw local0
    maxconn 10000

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout check 1s
    timeout http-request 30s
    timeout http-keep-alive 10s
    timeout queue 30s
    timeout client 24h
    timeout server 24h
    timeout tunnel 24h

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s
    hold obsolete 1s
    hold nx 1s
    hold refused 1s
    hold timeout 1s
    hold other 1s

frontend gateway
    bind :8080
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Real-IP
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Port
    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Proto http
    default_backend routers

backend routers
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server check inter 1s fastinter 1s downinter 1s fall 2 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
    server router-a router-a:8080
    server router-b router-b:8080

listen internal_stats
    bind :8404
    stats enable
    stats uri /stats
    stats hide-version
